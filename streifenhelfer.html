<html lang="de">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Streifenhelfer</title>
  <style>
    :root {
      --primary-navy: #0a2540;
      --police-blue: #0056b3;
      --police-blue-hover: #003d80;
      --accent-gold: #f1c40f;
      --bg-gray: #f4f6f9;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --danger-red: #dc2626;
      --danger-red-hover: #b91c1c;
      --border-color: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-gray);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    header {
      background-color: var(--primary-navy);
      color: #ffffff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 10;
      min-height: 60px;
    }

    .header-title-container {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      padding-right: 10px;
      overflow: hidden;
    }

    .app-subtitle {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-gold);
      font-weight: 700;
    }

    .header-title {
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-toggle-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      padding: 6px;
      display: none; /* Only visible on list pages */
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .search-toggle-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .search-toggle-btn svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Search Container */
    .search-bar-container {
      background-color: var(--primary-navy);
      padding: 0 16px 12px 16px;
      display: none;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .search-bar-container.active {
      display: block;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 15px;
      outline: none;
      background: #ffffff;
      color: var(--text-dark);
      padding-right: 44px;
    }

    .search-bar-inner {
      position: relative;
    }

    .search-clear-btn {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      padding: 6px;
      line-height: 1;
      border-radius: 50%;
    }

    .search-clear-btn:hover {
      color: var(--police-blue);
    }

    .search-meta {
      margin-top: 8px;
      color: #dbeafe;
      font-size: 13px;
      min-height: 1.2em;
    }

    /* Main Content Area */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .grid-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Spacer am Ende der Liste, damit nichts unter dem Zurück-Button verschwindet */
    .grid-container::after {
      content: "";
      display: block;
      height: 110px; 
      flex-shrink: 0;
    }

    /* Buttons */
    .btn {
      background-color: var(--card-bg);
      color: var(--police-blue);
      border: 1.5px solid var(--border-color);
      padding: 16px 18px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
      background-color: #ebf5ff;
      border-color: var(--police-blue);
    }

    .btn-arrow {
      color: var(--text-muted);
      font-size: 18px;
    }

    .btn-danger {
      background-color: var(--danger-red);
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(220, 38, 38, 0.3);
    }

    .btn-danger:active {
      background-color: var(--danger-red-hover);
    }

    /* Cards / Info Boxes */
    .card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 14px 16px;
      border-left: 4px solid var(--police-blue);
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      line-height: 1.4;
      cursor: default;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card.clickable {
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
    }

    .card-title {
      font-weight: 600;
      color: var(--text-dark);
    }

    .card-value {
      font-weight: 700;
      color: var(--police-blue);
      text-align: right;
    }

    .doc-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .table-section {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      overflow-x: auto;
    }

    .info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .info-table th,
    .info-table td {
      border: 1px solid var(--border-color);
      padding: 8px 6px;
      text-align: center;
    }

    .info-table th {
      background-color: #eff6ff;
      color: var(--police-blue);
      font-weight: 700;
    }

    .info-note {
      margin-top: 10px;
      padding: 10px 12px;
      border-left: 4px solid var(--accent-gold);
      background-color: #fffbe6;
      color: var(--text-dark);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }

    .checklist {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      background-color: var(--card-bg);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .checklist-item:active {
      transform: scale(0.99);
    }

    .checklist-checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid var(--police-blue);
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--police-blue);
      font-size: 14px;
      flex-shrink: 0;
      background-color: #ffffff;
    }

    .checklist-item.checked {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
    }

    .checklist-item.checked .checklist-checkbox {
      background-color: var(--police-blue);
      color: #ffffff;
      border-color: var(--police-blue);
    }

    .checklist-item.checked .checklist-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .checklist-text {
      color: var(--text-dark);
      line-height: 1.4;
      font-size: 14px;
    }

    .collapsible-section {
      background-color: var(--card-bg);
      border-radius: 10px;
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
    }

    .collapsible-trigger {
      width: 100%;
      background: linear-gradient(90deg, #eff6ff 0%, #f8fbff 100%);
      border: none;
      padding: 14px 16px;
      text-align: left;
      font-size: 15px;
      font-weight: 700;
      color: var(--police-blue);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .collapsible-content {
      display: none;
      padding: 0 16px 14px 16px;
      background-color: #fcfdff;
    }

    .collapsible-section.open .collapsible-content {
      display: block;
    }

    .collapsible-section.open .collapsible-trigger .collapsible-arrow {
      transform: rotate(180deg);
    }

    .collapsible-arrow {
      transition: transform 0.2s ease;
      font-size: 16px;
      color: var(--text-muted);
    }

    .collapsible-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .collapsible-item {
      padding: 10px 12px;
      border-radius: 8px;
      background-color: #f8fafc;
      border: 1px solid var(--border-color);
      color: var(--text-dark);
      line-height: 1.45;
      font-size: 14px;
    }

    /* Fixed Bottom Bar for Back Button */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(244, 246, 249, 0.95);
      backdrop-filter: blur(8px);
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: center;
      z-index: 20;
    }

    .btn-back {
      background-color: var(--primary-navy);
      color: #ffffff;
      border: none;
      width: 100%;
      max-width: 600px;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-back:active {
      background-color: #05182b;
      transform: scale(0.99);
    }

    .no-results {
      text-align: center;
      color: var(--text-muted);
      padding: 20px;
      font-style: italic;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 80px;
      transform: translateX(-50%) translateY(0);
      min-width: 180px;
      max-width: 90%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      border-radius: 999px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
      font-size: 13px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 50;
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 80;
    }

    .modal-overlay[hidden] {
      display: none;
    }

    .modal-card {
      width: min(100%, 420px);
      background: var(--card-bg);
      border-radius: 14px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.28);
      overflow: hidden;
    }

    .modal-header {
      background: var(--primary-navy);
      color: #ffffff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
    }

    .modal-close {
      border: none;
      background: transparent;
      color: #ffffff;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }

    .modal-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .modal-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .modal-input.input-error {
      border-color: var(--danger-red);
      background: #fef2f2;
    }

    .modal-hint {
      min-height: 1.1em;
      font-size: 13px;
      color: var(--danger-red);
    }

    .modal-submit {
      background-color: var(--police-blue);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-submit:active {
      background-color: var(--police-blue-hover);
    }

    .text-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .text-list-item {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      color: var(--text-dark);
      line-height: 1.5;
      font-size: 14px;
    }

    @media (max-width: 540px) {
      header {
        padding: 12px 14px;
      }

      .header-title {
        font-size: 15px;
      }

      .app-subtitle {
        font-size: 9px;
      }

      .search-bar-container {
        padding: 0 14px 10px;
      }

      .search-input {
        font-size: 14px;
        padding: 12px 14px;
      }

      .grid-container {
        gap: 10px;
        padding: 0 0 4px;
      }

      .btn {
        padding: 14px 16px;
        font-size: 14px;
      }

      .card {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .card-value {
        width: 100%;
        text-align: right;
        word-break: break-word;
      }

      .doc-row {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .btn-danger {
        width: 100%;
        justify-content: center;
      }

      .bottom-bar {
        padding: 10px 14px;
      }

      .btn-back {
        font-size: 15px;
        padding: 13px;
      }
    }
  </style>
</head>

      <span class="app-subtitle">Streifenhelfer</span>

        <div class="modal-hint" id="password-hint" aria-live="polite"></div>
        <button class="modal-submit" id="password-submit" type="button">Öffnen</button>
      </div>
    </div>
  </div>

    // === Logic & Renderer ===
    
    let historyStack = ['home'];

    function renderPage(pageId) {
      const page = appTree[pageId];
      if (!page) return;

      document.getElementById('page-title').innerText = page.title;
      const container = document.getElementById('app-view');
      container.innerHTML = '';

      // Back Button aus- oder einblenden
      document.getElementById('bottom-bar').style.display = historyStack.length > 1 ? 'flex' : 'none';

      // Spezielle Tabellen Ansicht rendern
      if (page.tableRows) {
        const tableSec = document.createElement('div');
        tableSec.className = 'table-section';
        let tableHtml = '<table class="info-table">';
        page.tableRows.forEach((row, idx) => {
          tableHtml += '<tr>';
          row.forEach(cell => {
            tableHtml += idx === 0 ? `<th>${cell}</th>` : `<td>${cell}</td>`;
          });
          tableHtml += '</tr>';
        });
        tableHtml += '</table>';
        if (page.tableNote) {
          tableHtml += `<div class="info-note">${page.tableNote}</div>`;
        }
        tableSec.innerHTML = tableHtml;
        container.appendChild(tableSec);
      }

      // Alle Einzel-Items (Buttons, Cards, Checklisten) iterieren
      if (page.items) {
        page.items.forEach(item => {
          let el;
          
          if (page.type === 'buttons' || page.type === 'doc_buttons') {
            el = document.createElement('div');
            el.className = 'btn';
            
            // Wenn Card inline gefordert ist
            if(item.card) {
                el.className = 'card';
                el.innerHTML = `<span class="card-title">${item.label}</span><span class="card-value">${item.val}</span>`;
            } else {
                el.innerHTML = `<span>${item.label}</span><span class="btn-arrow">&#8250;</span>`;
                el.onclick = () => {
                  if (item.target) navigateTo(item.target);
                  else if (item.passwordProtected) openPasswordModal('internal_ablaeufe');
                  else if (item.url) window.open(item.url, '_blank');
                  else if (item.pdf || item.img) showToast('Öffne Datei: ' + (item.pdf || item.img));
                };
            }
          } 
          else if (page.type === 'cards' || page.type === 'bepo_special' || page.type === 'table_cards') {
            el = document.createElement('div');
            el.className = 'card';
            let valHtml = item.val ? `<span class="card-value" ${item.color ? `style="color:${item.color}"` : ''}>${item.val}</span>` : '';
            el.innerHTML = `<span class="card-title">${item.label}</span>${valHtml}`;
            if (item.note) el.classList.add('info-note');
          } 
          else if (page.type === 'checklist') {
            el = document.createElement('div');
            el.className = 'checklist-item';
            el.innerHTML = `<div class="checklist-checkbox">&#10003;</div><div class="checklist-text">${item.label}</div>`;
            el.onclick = () => el.classList.toggle('checked');
          } 
          else if (page.type === 'vev_guide') {
            el = document.createElement('div');
            el.className = 'collapsible-section';
            let pointsHtml = item.points.map(p => `<div class="collapsible-item">${p}</div>`).join('');
            el.innerHTML = `
              <button class="collapsible-trigger" onclick="this.parentElement.classList.toggle('open')">
                ${item.title} <span class="collapsible-arrow">&#9660;</span>
              </button>
              <div class="collapsible-content">
                <div class="collapsible-list">${pointsHtml}</div>
              </div>
            `;
          }

          if (el) container.appendChild(el);
        });
      }

      // Extra Button Support für bepo_special
      if (page.extraButton) {
        const btn = document.createElement('div');
        btn.className = 'btn';
        btn.innerHTML = `<span>${page.extraButton.label}</span><span class="btn-arrow">&#8250;</span>`;
        btn.onclick = () => navigateTo(page.extraButton.target);
        container.appendChild(btn);
      }
    }

    function navigateTo(pageId) {
      if (appTree[pageId]) {
        historyStack.push(pageId);
        renderPage(pageId);
      } else {
        showToast('Seite nicht gefunden');
      }
    }

    function goBack() {
      if (historyStack.length > 1) {
        historyStack.pop();
        renderPage(historyStack[historyStack.length - 1]);
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 3000);
    }

    function openPasswordModal(target) {
      const modal = document.getElementById('password-modal');
      modal.hidden = false;
      document.getElementById('password-submit').onclick = () => {
        // Dummy Passwort Validierung da nur Frontend logik sichtbar war
        const val = document.getElementById('password-input').value;
        if (val) {
          modal.hidden = true;
          document.getElementById('password-input').value = '';
          navigateTo(target);
        } else {
          document.getElementById('password-hint').innerText = 'Bitte Passwort eingeben';
        }
      };
    }

    document.getElementById('password-modal-close').onclick = () => {
      document.getElementById('password-modal').hidden = true;
    };

    // Initiales Rendern
    window.onload = () => {
      renderPage('home');
    };
  </script>
