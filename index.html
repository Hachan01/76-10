    if ('serviceWorker' in navigator) {

  <title>Streifenhelfer</title>
  <style>
    :root {
      --primary-navy: #0a2540;
      --police-blue: #0056b3;
      --police-blue-hover: #003d80;
      --accent-gold: #f1c40f;
      --bg-gray: #f4f6f9;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --danger-red: #dc2626;
      --border-color: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-gray);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--primary-navy);
      color: #ffffff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 10;
      min-height: 60px;
    }

    .header-title-container {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      padding-right: 10px;
      overflow: hidden;
    }

    .app-subtitle {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-gold);
      font-weight: 700;
    }

    .header-title {
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .grid-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
    }

    .grid-container::after {
      content: "";
      display: block;
      height: 110px;
      flex-shrink: 0;
    }

    .btn {
      background-color: var(--card-bg);
      color: var(--police-blue);
      border: 1.5px solid var(--border-color);
      padding: 16px 18px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn:active {
      transform: scale(0.98);
      background-color: #ebf5ff;
      border-color: var(--police-blue);
    }

    .btn-arrow {
      color: var(--text-muted);
      font-size: 18px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 14px 16px;
      border-left: 4px solid var(--police-blue);
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      line-height: 1.4;
    }

    .card-title {
      font-weight: 600;
      color: var(--text-dark);
    }

    .card-value {
      font-weight: 700;
      color: var(--police-blue);
      text-align: right;
    }

    .info-note {
      padding: 10px 12px;
      border-left: 4px solid var(--accent-gold);
      background-color: #fffbe6;
      color: var(--text-dark);
      border-radius: 8px;
      font-size: 14px;
    }

    .checklist {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      background-color: var(--card-bg);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    .checklist-checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid var(--police-blue);
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--police-blue);
      font-size: 14px;
      flex-shrink: 0;
    }

    .checklist-item.checked {
      background-color: #f1f5f9;
    }

    .checklist-item.checked .checklist-checkbox {
      background-color: var(--police-blue);
      color: #ffffff;
    }

    .checklist-item.checked .checklist-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .image-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 8px 0;
    }

    .image-container img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(244, 246, 249, 0.95);
      backdrop-filter: blur(8px);
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: center;
      z-index: 20;
    }

    .btn-back {
      background-color: var(--primary-navy);
      color: #ffffff;
      border: none;
      width: 100%;
      max-width: 600px;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 80px;
      transform: translateX(-50%);
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 50;
    }

    .toast.visible {
      opacity: 1;
    }
  </style>
</head>

    let historyStack = ['home'];

    const pageTitleEl = document.getElementById('page-title');
    const appViewEl = document.getElementById('app-view');
    const bottomBarEl = document.getElementById('bottom-bar');
    const toastEl = document.getElementById('toast');

    function init() {
      renderPage();
    }

    function navigateTo(targetKey) {
      if (!appTree[targetKey]) {
        alert('Inhalt befindet sich noch im Aufbau.');
        return;
      }
      historyStack.push(targetKey);
      renderPage();
    }

    function navigateToImage(title, imgSrc) {
      const imgKey = 'img_view_' + imgSrc;
      appTree[imgKey] = {
        title: title,
        type: 'image',
        src: imgSrc
      };
      navigateTo(imgKey);
    }

    function goBack() {
      if (historyStack.length > 1) {
        historyStack.pop();
        renderPage();
      }
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('visible');
      setTimeout(() => {
        toastEl.classList.remove('visible');
      }, 2000);
    }

    function renderPage() {
      const currentKey = historyStack[historyStack.length - 1];
      const pageData = appTree[currentKey];

      pageTitleEl.textContent = pageData.title;

      if (historyStack.length > 1) {
        bottomBarEl.style.display = 'flex';
      } else {
        bottomBarEl.style.display = 'none';
      }

      appViewEl.innerHTML = '';

      if (pageData.type === 'buttons') {
        pageData.items.forEach(item => {
          if (item.card) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <span class="card-title">${item.label}</span>
              <span class="card-value">${item.val}</span>
            `;
            appViewEl.appendChild(card);
            return;
          }

          const btn = document.createElement('button');
          btn.className = 'btn';
          btn.innerHTML = `<span>${item.label}</span><span class="btn-arrow">&#8250;</span>`;
          btn.onclick = () => {
            if (item.target) {
              navigateTo(item.target);
              return;
            }
            if (item.img) {
              navigateToImage(item.label, item.img);
              return;
            }
            if (item.pdf) {
              window.open(item.pdf, '_blank');
              return;
            }
            if (item.url) {
              window.open(item.url, '_blank');
              return;
            }
          };
          appViewEl.appendChild(btn);
        });
      } else if (pageData.type === 'checklist') {
        renderChecklist(pageData.items);
      } else if (pageData.type === 'cards') {
        renderCards(pageData.items);
      } else if (pageData.type === 'image') {
        renderImageViewer(pageData.src, pageData.title);
      }

      document.getElementById('main-content').scrollTop = 0;
    }

    function renderImageViewer(src, title) {
      const container = document.createElement('div');
      container.className = 'image-container';

      const img = document.createElement('img');
      img.src = src;
      img.alt = title;
      img.onerror = () => {
        container.innerHTML = `<div class="info-note">Das Bild <strong>${src}</strong> konnte nicht geladen werden. Prüfe, ob die Datei auf GitHub vorhanden ist.</div>`;
      };

      container.appendChild(img);
      appViewEl.appendChild(container);
    }

    function renderChecklist(items) {
      const note = document.createElement('div');
      note.className = 'info-note';
      note.textContent = 'Hinweis: Hake die Kästchen ab, sobald du die Aufgabe erledigt hast.';
      appViewEl.appendChild(note);

      const checklist = document.createElement('div');
      checklist.className = 'checklist';

      const storageKey = `checklist:${historyStack[historyStack.length - 1]}`;
      const completed = JSON.parse(localStorage.getItem(storageKey) || '[]');

      items.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'checklist-item';
        if (completed.includes(index)) {
          row.classList.add('checked');
        }

        const box = document.createElement('span');
        box.className = 'checklist-checkbox';
        box.textContent = completed.includes(index) ? '✓' : '';

        const text = document.createElement('span');
        text.className = 'checklist-text';
        text.textContent = item.label;

        row.appendChild(box);
        row.appendChild(text);

        row.addEventListener('click', () => {
          const current = JSON.parse(localStorage.getItem(storageKey) || '[]');
          const next = current.includes(index)
            ? current.filter(i => i !== index)
            : [...current, index];
          localStorage.setItem(storageKey, JSON.stringify(next));
          row.classList.toggle('checked', next.includes(index));
          box.textContent = next.includes(index) ? '✓' : '';
        });

        checklist.appendChild(row);
      });

      appViewEl.appendChild(checklist);
    }

    function renderCards(items) {
      items.forEach(item => {
        const card = document.createElement('div');
        if (item.note) {
          card.className = 'info-note';
          card.innerHTML = `<strong>Hinweis:</strong> ${item.label}`;
        } else {
          card.className = 'card';
          const titleHtml = item.label ? `<span class="card-title">${item.label}</span>` : '';
          const valueHtml = item.val ? `<span class="card-value">${item.val}</span>` : '';
          card.innerHTML = `${titleHtml}${valueHtml}`;

          if (item.val) {
            card.style.cursor = 'pointer';
            card.onclick = () => {
              navigator.clipboard.writeText(item.val).then(() => {
                showToast(`Kopiert: ${item.val}`);
              });
            };
          }
        }
        appViewEl.appendChild(card);
      });
    }

    init();
  </script>
